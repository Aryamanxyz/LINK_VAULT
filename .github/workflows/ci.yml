name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: Linkvault

      - name: Build project
        run: npm run build
        working-directory: Linkvault

      - name: Run tests (if any)
        run: npm test || echo "No test script defined"
        working-directory: Linkvault
